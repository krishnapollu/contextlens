<!doctype html>
<html><head><meta charset="utf-8"><title>ContextLens</title><link rel="stylesheet" href="popup.css"></head><body><main><header><div class="brandmark"><svg viewBox="0 0 32 32"><path d="M16 3a13 13 0 1 0 13 13"/><path d="M16 8a8 8 0 1 0 8 8"/><circle cx="16" cy="16" r="2.5"/></svg></div><div class="heading"><h1>ContextLens</h1><p>AI-ready UI context, captured locally.</p></div><span class="local"><i></i>LOCAL</span></header><div class="capture-row"><section class="state-card"><div><span class="label"><i class="glow-bullet"></i>CURRENT STATE</span><strong id="meta">No capture yet</strong></div><button id="clear" class="icon ghost" title="Clear capture" aria-label="Clear capture"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></section><button id="capture" class="primary"><span>✦</span> Capture</button></div><section class="preview-card"><div class="card-head"><span><i class="glow-bullet"></i>SNAPSHOT PREVIEW</span><div class="card-actions"><select id="format" aria-label="Export format"><option value="markdown">MD</option><option value="json">JSON</option></select><button id="copy" class="icon ghost" title="Copy snapshot" aria-label="Copy snapshot"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg></button><button id="download" class="icon ghost" title="Export snapshot" aria-label="Export snapshot"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg></button><button id="enhance" class="icon ghost" title="Improve names with Gemini" aria-label="Improve names with Gemini">✦</button><button id="locate" class="icon ghost" title="Pick a UI element" aria-label="Pick a UI element">⌖</button></div></div><textarea id="preview" readonly placeholder="Your semantic UI snapshot will appear here…"></textarea></section><div id="shot"><div class="shot-head"><span><i class="glow-bullet"></i>VISUAL REFERENCE</span><div class="card-actions"><butt
