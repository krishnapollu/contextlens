<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">ContextLens logo</title>
  <desc id="desc">A glowing lens with concentric context rings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="128" height="128" rx="32" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" filter="url(#glow)">
    <path d="M64 20a44 44 0 1 0 44 44" stroke-width="6" opacity=".92"/>
    <path d="M64 38a26 26 0 1 0 26 26" stroke-width="6" opacity=".96"/>
    <circle cx="64" cy="64" r="8" fill="#fff" stroke="none"/>
  </g>
  <circle cx="64" cy="64" r="3" fill="#4f46e5"/>
</svg>
